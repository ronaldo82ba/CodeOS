[workspace]
resolver = "2"
members = [
    "core",
    "services/window",
    "services/appmgr",
    "services/pkg",
    "services/notif",
    "services/auth",
    "services/storage",
    "framework/runtime",
    "framework/ui",
    "framework/ipc_client",
    "system_ui/shell",
    "system_ui/settings",
    "sdk/cli",
    "simulator/desktop",
    "tools/integration",
]
default-members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Ronaldo Mijares <codeos@example.com>"]
repository = "https://github.com/Ronaldo82ba/CodeOS"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
